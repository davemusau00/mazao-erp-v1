# Illustrative only. Pin verified image tags/digests before any deployment.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?required}
      POSTGRES_USER: ${DB_USER:?required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?required}
    volumes:
      - mazao_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [private]
  api:
    image: ${MAZAO_API_IMAGE:?required}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?required}
      NODE_ENV: production
    depends_on:
      db: {condition: service_healthy}
    ports: ["127.0.0.1:${API_PORT:-4101}:4101"]
    networks: [private]
  worker:
    image: ${MAZAO_WORKER_IMAGE:?required}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?required}
      NODE_ENV: production
    depends_on:
      db: {condition: service_healthy}
    networks: [private]
volumes:
  mazao_pg:
networks:
  private:
    driver: bridge
