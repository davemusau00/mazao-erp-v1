# Run with: docker compose --project-name mazao --env-file /srv/mazao/.env -f compose.yml up -d
services:
  db:
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?required}
      POSTGRES_USER: ${DB_USER:?required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?required}
    volumes:
      - mazao_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 1g
    cpus: 1.0
    networks: [private]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  api:
    image: ${MAZAO_API_IMAGE:?required}
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?required}
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4101
      APP_ORIGINS: ${APP_ORIGINS:?required}
      CREDENTIAL_FINGERPRINT_KEY: ${CREDENTIAL_FINGERPRINT_KEY:?required}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-4101}:4101"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /home/bun/.bun:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - 'fetch("http://127.0.0.1:4101/api/v1/health/live").then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 768m
    cpus: 1.0
    networks: [private]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  mazao_pg:
    name: mazao-postgres-data

networks:
  private:
    name: mazao-private
    driver: bridge
