# TEMPLATE: replace hostnames/certificate paths after DNS and TLS provisioning.
server {
    listen 443 ssl http2;
    server_name app.mazao.example;
    ssl_certificate /etc/letsencrypt/live/app.mazao.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.mazao.example/privkey.pem;
    root /var/www/mazao/current;
    location /assets/ { try_files $uri =404; add_header Cache-Control "public,max-age=31536000,immutable"; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-store"; }
}
server {
    listen 443 ssl http2;
    server_name api.mazao.example;
    ssl_certificate /etc/letsencrypt/live/api.mazao.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mazao.example/privkey.pem;
    client_max_body_size 10m;
    location / { proxy_pass http://127.0.0.1:4101; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Request-ID $request_id; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
}
