# Install as a new sites-available/sites-enabled file for this hostname only.
# Keep mazaoapi.davemusau.co.ke out of this vhost: the PWA uses same-origin /api/v1.
server {
    listen 80;
    listen [::]:80;
    server_name mazao.davemusau.co.ke;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mazao.davemusau.co.ke;

    ssl_certificate /etc/letsencrypt/live/mazao.davemusau.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mazao.davemusau.co.ke/privkey.pem;
    root /var/www/mazao/current;
    index index.html;
    client_max_body_size 10m;

    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:4101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public,max-age=31536000,immutable" always;
    }

    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location = /manifest.webmanifest {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }
}
