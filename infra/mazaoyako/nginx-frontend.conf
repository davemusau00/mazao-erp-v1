server {
    listen 80;
    listen [::]:80;
    server_name mazaoyako.co.ke;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/mazaoyako/acme;
        default_type text/plain;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mazaoyako.co.ke;

    ssl_certificate /etc/letsencrypt/live/mazaoyako.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mazaoyako.co.ke/privkey.pem;
    root /var/www/mazaoyako/current;
    index index.html;

    location ^~ /assets/ {
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 5;
        gzip_types text/css application/javascript;
        try_files $uri =404;
        add_header Cache-Control "public,max-age=31536000,immutable" always;
    }

    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location = /manifest.webmanifest {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }
}
