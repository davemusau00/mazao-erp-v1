server {
    listen 80;
    listen [::]:80;
    server_name api.mazaoyako.co.ke;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/mazaoyako/acme;
        default_type text/plain;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.mazaoyako.co.ke;

    ssl_certificate /etc/letsencrypt/live/api.mazaoyako.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mazaoyako.co.ke/privkey.pem;
    client_max_body_size 2m;

    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:4102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store" always;
    }

    location / { return 404; }
}
