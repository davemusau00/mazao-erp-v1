map $uri $route_template {
  default $uri;
  ~^/api/v1/sales/orders/[^/]+/receipt$ /api/v1/sales/orders/:id/receipt;
  ~^/api/v1/sales/orders/[^/]+/receipt/assets/[^/]+$ /api/v1/sales/orders/:id/receipt/assets/:kind;
  ~^/api/v1/customers/[^/]+/statement$ /api/v1/customers/:id/statement;
  ~^/api/v1/inventory/counts/[^/]+$ /api/v1/inventory/counts/:id;
  ~^/api/v1/staff/[^/]+/sessions$ /api/v1/staff/:id/sessions;
  ~^/performance-legacy-configuration\.json$ /api/v1/configuration_legacy_inline_replay;
}

log_format mazao_performance '$time_iso8601 request_id=$http_x_request_id route=$route_template status=$status total_seconds=$request_time upstream_seconds=$upstream_response_time response_bytes=$body_bytes_sent';
access_log /var/log/nginx/access.log mazao_performance;

gzip on;
gzip_min_length 1024;
gzip_comp_level 4;
gzip_types application/json application/javascript text/css image/svg+xml;

server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  location = /api/v1/configuration {
    if ($arg_legacy_inline_reproduction = 1) { rewrite ^ /performance-legacy-configuration.json last; }
    proxy_pass http://mazao-performance-api:4101;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $http_x_request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering on;
  }

  location = /performance-legacy-configuration.json {
    alias /etc/nginx/performance-legacy-configuration.json;
    default_type application/json;
    add_header X-Request-ID $http_x_request_id always;
    add_header Cache-Control "no-store" always;
  }

  location /api/v1/ {
    proxy_pass http://mazao-performance-api:4101;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $http_x_request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering on;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
