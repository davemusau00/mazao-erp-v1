name: Mazao checks and release artifacts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck-and-build:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/mazao_test
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/mazao_test
      APP_ORIGINS: http://localhost:3000
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mazao_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mazao_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Apply fresh database migrations
        run: bun run db:migrate
      - name: Verify migration rerun is checksum-safe
        run: bun run db:migrate
      - run: bun run typecheck
      - run: bun run test:api
      - name: Install Chromium for browser acceptance
        run: bunx playwright install --with-deps chromium
      - name: Build PWA and run browser acceptance
        run: bun run test:e2e
      - name: Upload immutable PWA build for main releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: mazao-pwa-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

  publish-api-image:
    name: Publish API image after acceptance
    needs: typecheck-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and push API image tagged with the source commit
        env:
          IMAGE: ghcr.io/${{ github.repository }}/api:${{ github.sha }}
        run: |
          docker build --pull --platform linux/amd64 --file Dockerfile.api --tag "$IMAGE" .
          docker push "$IMAGE"
          docker save --output "$RUNNER_TEMP/mazao-api-image.tar" "$IMAGE"
      - name: Upload the exact API image for SSH deployment
        uses: actions/upload-artifact@v4
        with:
          name: mazao-api-image-${{ github.sha }}
          path: ${{ runner.temp }}/mazao-api-image.tar
          if-no-files-found: error
          retention-days: 90
